name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@8b83337077bd32ff0314ef0b902adc561d759abc # main

  tests:
    name: Native nightly tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@b98983b02b52780f44951e725381b03ea2b57bdb # main
    with:
      command: |
        cargo test --locked --workspace --all-features
        cargo build --locked --release
