name: Rust review gate

on:
  workflow_run:
    workflows: [Rust review trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rust-review-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/review-trigger.yml' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rust-review-gate-target

    steps:
      # workflow_run executes the default-branch workflow. Checkout remains
      # trusted; PR code is fetched only as diff text and is never executed.
      - name: Check out trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust 1.99
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@0188eacbbff0836d0b5eca53b6cad4355adecd9e # main
        with:
          rust-toolchain: "1.99.0"

      - name: Build trusted reviewer
        run: cargo +1.99.0 build --release --locked

      - name: Review pull request
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$CARGO_TARGET_DIR/release/rust-review-gate" github
          --repo "${{ github.repository }}"
          --pull "${{ github.event.workflow_run.pull_requests[0].number }}"
          --min-votes 2
          --samples 3
          --temperature 0.20
          --policy '.github/rust-review-policy.md'
          --informational-only
          --model 'meta/muse-spark-1.3-contributor'
          --model 'z-ai/glm-5.3-flash'
          --model '~openai/gpt-luna-latest'

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@0188eacbbff0836d0b5eca53b6cad4355adecd9e # main
