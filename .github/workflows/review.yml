name: Rust review gate

on:
  workflow_run:
    workflows: [Rust review trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rust-review-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/review-trigger.yml' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TARGET_DIR: ${{ runner.temp }}/rust-review-gate-target

    steps:
      # workflow_run executes the default-branch workflow. Checkout remains
      # trusted; PR code is fetched only as diff text and is never executed.
      - name: Check out trusted reviewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust 1.99
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: Build trusted reviewer
        run: cargo +1.99.0 build --release --locked

      - name: Review pull request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$CARGO_TARGET_DIR/release/rust-review-gate" github
          --repo "${{ github.repository }}"
          --pull "${{ github.event.workflow_run.pull_requests[0].number }}"
          --min-votes 2
          --samples 3
          --temperature 0.20
          --model 'meta/muse-spark-1.3-contributor'
          --model 'z-ai/glm-5.3-flash'
          --model '~openai/gpt-luna-latest'
